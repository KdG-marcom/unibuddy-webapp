name: Update data.json

on:
  schedule:
    # Drie pogingen per uur (UTC). GitHub voert geplande runs niet stipt uit en slaat er geregeld over;
    # met drie pogingen per uur loopt er in de praktijk minstens elk uur een. Zonder wijziging in Airtable komt er geen commit.
    - cron: '7,27,47 * * * *'
  workflow_dispatch: {}        # handmatig startbaar via de Actions-tab
  push:
    branches: [ main ]         # ook bij elke push naar main

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Genereer data.json uit Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node build-data.js

      - name: Commit & push als er iets gewijzigd is
        run: |
          git config user.name  "kdg-data-bot"
          git config user.email "actions@users.noreply.github.com"
          # Het tijdstip "updated" verandert bij elke run: alleen committen als de inhoud zelf wijzigt.
          if git diff --quiet -I'"updated"' -- data.json; then
            echo "Geen wijzigingen in data.json."
            git checkout -- data.json
          else
            git add data.json
            git commit -m "Update data.json ($(date -u +%FT%TZ))"
            git push
          fi
